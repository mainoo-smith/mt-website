<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
  <title>Contact KontrolIQ</title>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700;800&family=Lato:wght@400;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="../css/kq.css">
</head>
<body data-kq-page="contact">
  <nav class="navbar navbar-expand-lg kq-navbar">
    <div class="container">
      <a class="navbar-brand" href="index.html">Kontrol<span class="kq-iq">IQ</span></a>
      <button class="navbar-toggler" type="button" data-toggle="collapse" data-target="#nav"><i class="fas fa-bars text-white"></i></button>
      <div class="collapse navbar-collapse" id="nav">
        <ul class="navbar-nav ml-auto">
          <li class="nav-item"><a class="nav-link text-white" href="assess.html">Readiness Assessment</a></li>
          <li class="nav-item"><a class="nav-link text-white" href="index.html">Overview</a></li>
        </ul>
      </div>
    </div>
  </nav>

  <header class="kq-hero py-4">
    <div class="container text-center">
      <span class="badge badge-accent">Talk to us</span>
      <h1 class="mt-2">Let&apos;s talk readiness</h1>
      <p class="lead">Tell us about your compliance goals and we&apos;ll follow up.</p>
    </div>
  </header>

  <section class="kq-section">
    <div class="container">
      <div class="row justify-content-center">
        <div class="col-md-7">
          <div id="cErr" class="alert alert-warning" style="display:none"></div>
          <div class="assess-card p-4">
            <form id="contactForm">
              <div class="form-group">
                <label>Full name *</label>
                <input class="form-control" name="full_name" required autocomplete="name">
              </div>
              <div class="form-group">
                <label>Work email *</label>
                <input type="email" class="form-control" name="email" required autocomplete="email">
              </div>
              <div class="form-group">
                <label>Company</label>
                <input class="form-control" name="company" autocomplete="organization">
              </div>
              <div class="form-group">
                <label>What&apos;s on your mind?</label>
                <textarea class="form-control" name="message" rows="4" placeholder="e.g. We have a BoG review coming up and need to get evidence in order..."></textarea>
              </div>
              <button type="submit" class="btn btn-accent btn-lg btn-block">Send message</button>
            </form>
          </div>
          <div class="text-center mt-4">
            <p class="text-muted small">Prefer to book directly?</p>
            <a href="https://calendly.com/mainootechnologies" target="_blank" rel="noopener" class="btn btn-outline-accent"><i class="far fa-calendar mr-2"></i>Schedule a demo on Calendly</a>
          </div>
        </div>
      </div>
    </div>
  </section>

  <footer class="kq-footer py-4">
    <div class="container text-center">
      <p class="small mb-0"><a href="../index.html">mainootechnologies.com</a></p>
    </div>
  </footer>
  <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/js/bootstrap.bundle.min.js"></script>
  <script src="../js/funnel-config.js"></script>
  <script src="../js/app.js"></script>
</body>
</html>
